<script>
    async function executeBuild() {
        const terminal = document.getElementById('terminal');
        const lang = document.getElementById('language').value;
        const code = document.getElementById('editor').value;
        
        // Output initialization to the web console
        terminal.innerHTML += `<br>> Transmitting ${lang} source to Ultra-Compiler engine...`;
        
        try {
            // POST the code to the FastAPI backend
            const response = await fetch('/api/compile', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                    language: lang,
                    source_code: code,
                    target_format: 'wasm' 
                })
            });

            const data = await response.json();
            
            // Format the backend log output and print to the web terminal
            const formattedOutput = data.terminal_output.replace(/\n/g, '<br>');
            terminal.innerHTML += `<br>> <strong>[System Response]:</strong><br>${formattedOutput}`;
            
        } catch (error) {
            terminal.innerHTML += `<br><span style="color: #ff7b72;">> [Network Error]: Failed to reach the compiler backend. Is the server running?</span>`;
        }
        
        // Auto-scroll terminal to the bottom
        terminal.scrollTop = terminal.scrollHeight;
    }
</script>
