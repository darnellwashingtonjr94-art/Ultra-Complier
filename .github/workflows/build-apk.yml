name: Build Android APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Java 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Bootstrap and Build with Gradle
      run: |
        # Ensure the physical 'app' module directory and its build file exist at root
        mkdir -p app
        cat << 'EOF' > app/build.gradle.kts
        plugins {
            id("com.android.application")
        }
        android {
            namespace = "com.ultracompiler.app"
            compileSdk = 34
            defaultConfig {
                applicationId = "com.ultracompiler.app"
                minSdk = 24
                targetSdk = 34
                versionCode = 1
                versionName = "1.0"
            }
        }
        EOF

        # Configure root settings.gradle.kts with proper repository resolution and module inclusion
        cat << 'EOF' > settings.gradle.kts
        pluginManagement {
            repositories {
                google()
                mavenCentral()
                gradlePluginPortal()
            }
        }
        dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories {
                google()
                mavenCentral()
            }
        }
        rootProject.name = "UltraCompilerApp"
        include(":app")
        EOF

        # Ensure root-level build.gradle.kts exists
        if [ ! -f "build.gradle.kts" ]; then
            cat << 'EOF' > build.gradle.kts
            plugins {
                id("com.android.application") version "8.2.0" apply false
            }
        EOF
        fi

        # Initialize Gradle wrapper if missing
        if [ ! -f "./gradlew" ]; then
            gradle wrapper
        fi
        
        chmod +x ./gradlew
        ./gradlew assembleDebug
