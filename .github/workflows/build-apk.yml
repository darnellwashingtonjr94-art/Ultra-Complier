name: Build Android APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Crucial Fix: Checks out your repository code so the files exist in the runner
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Sets up the Java 17 environment (matching the Temurin environment from your logs)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # 3. Grants execute permission now that the file is actually present
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 4. Builds the APK
      - name: Build with Gradle
        run: ./gradlew assembleDebug
