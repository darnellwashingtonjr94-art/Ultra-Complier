name: Build Android APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Java 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Locate Android Project and Build
      run: |
        # Find the actual Android project directory containing settings.gradle
        PROJECT_DIR=$(find . -name "settings.gradle" -o -name "settings.gradle.kts" -type f -print -quit | xargs dirname)
        
        if [ -z "$PROJECT_DIR" ] || [ "$PROJECT_DIR" = "." ]; then
            PROJECT_DIR=$(find . -name "build.gradle" -o -name "build.gradle.kts" -type f -print -quit | xargs dirname)
        fi
        
        if [ -z "$PROJECT_DIR" ]; then
            echo "Error: Could not find Android project root (no settings.gradle or build.gradle found)." >&2
            exit 1
        fi
        
        echo "Found Android project root at: $PROJECT_DIR"
        cd "$PROJECT_DIR"
        
        # Ensure gradlew exists in the correct project directory, generate it if missing
        if [ ! -f "./gradlew" ]; then
            echo "Generating Gradle wrapper in $PROJECT_DIR..."
            gradle wrapper
        fi
        
        chmod +x ./gradlew
        ./gradlew assembleDebug
