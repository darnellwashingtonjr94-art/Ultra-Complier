name: Build Android APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Downloads your repository into the runner
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Sets up the correct Java environment
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # 3. Smart Search & Execute Permission
      - name: Find and Grant Permission to gradlew
        run: |
          GRADLEW_PATH=$(find . -name "gradlew" | head -n 1)
          if [ -z "$GRADLEW_PATH" ]; then
            echo "CRITICAL ERROR: 'gradlew' file NOT FOUND anywhere in the repository."
            echo "You must commit 'gradlew', 'gradlew.bat', and the 'gradle/' folder to GitHub."
            exit 1
          fi
          echo "Found gradlew at: $GRADLEW_PATH"
          chmod +x "$GRADLEW_PATH"

      # 4. Navigate to the detected directory and Build
      - name: Build with Gradle
        run: |
          GRADLEW_PATH=$(find . -name "gradlew" | head -n 1)
          GRADLEW_DIR=$(dirname "$GRADLEW_PATH")
          cd "$GRADLEW_DIR"
          ./gradlew assembleDebug
