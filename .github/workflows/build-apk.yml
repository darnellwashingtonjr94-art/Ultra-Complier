name: Build Android APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Java 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Locate and Build with Gradle
      run: |
        echo "Searching for gradlew..."
        find . -name "gradlew"
        
        GRADLEW_PATH=$(find . -name "gradlew" -print -quit)
        
        if [ -z "$GRADLEW_PATH" ]; then
            echo "Error: gradlew file not found anywhere in workspace." >&2
            exit 1
        fi
        
        TARGET_DIR=$(dirname "$GRADLEW_PATH")
        echo "Found gradlew at: $GRADLEW_PATH"
        echo "Moving into directory: $TARGET_DIR"
        
        cd "$TARGET_DIR"
        chmod +x ./gradlew
        ./gradlew assembleDebug
