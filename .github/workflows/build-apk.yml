name: Build Android APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: # 1. Download the repository code into the runner
      uses: actions/checkout@v4

    - name: # 2. Set up the Java 17 environment
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: # 3. Automatically find gradlew and grant execute permissions
      run: |
        GRADLEW_PATH=$(find . -name "gradlew" -print -quit)
        if [ -z "$GRADLEW_PATH" ]; then
            echo "Error: gradlew file not found." >&2
            exit 1
        fi
        chmod +x "$GRADLEW_PATH"

    - name: # 4. Navigate to the correct directory and build the APK with Gradle
      run: |
        GRADLEW_PATH=$(find . -name "gradlew" -print -quit)
        cd $(dirname "$GRADLEW_PATH")
        ./gradlew assembleDebug
