name: Build Android APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Java 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Locate and Build with Gradle
      run: |
        # Explicitly check workspace structure and find gradlew or create wrapper fallback if missing
        if [ ! -f "./gradlew" ]; then
            echo "Gradle wrapper not found in root, generating one..."
            gradle wrapper
        fi
        
        chmod +x ./gradlew
        ./gradlew assembleDebug
