name: Build Android APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Java 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Locate and Build with Gradle
      run: |
        # Fallback search ensuring we check current directory, workspace root, and any nested subfolders thoroughly
        GRADLEW_PATH=$(find . -name "gradlew" -type f -print -quit)
        if [ -z "$GRADLEW_PATH" ]; then
            GRADLEW_PATH=$(find "$GITHUB_WORKSPACE" -name "gradlew" -type f -print -quit)
        fi
        
        if [ -z "$GRADLEW_PATH" ]; then
            echo "Error: gradlew wrapper not found anywhere in the repository." >&2
            exit 1
        fi
        
        TARGET_DIR=$(dirname "$GRADLEW_PATH")
        echo "Found gradlew at: $GRADLEW_PATH"
        echo "Target build directory: $TARGET_DIR"
        
        cd "$TARGET_DIR"
        chmod +x ./gradlew
        ./gradlew assembleDebug
