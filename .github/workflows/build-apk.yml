name: Build Android APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Java 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Bootstrap and Build with Gradle
      run: |
        PROJECT_DIR=$(find . -name "settings.gradle*" -o -name "build.gradle*" -type f -print -quit | xargs dirname)
        if [ -z "$PROJECT_DIR" ]; then
            PROJECT_DIR="."
        fi
        
        cd "$PROJECT_DIR"
        
        # Ensure the physical 'app' module directory exists alongside settings.gradle.kts
        mkdir -p app
        if [ ! -f "app/build.gradle.kts" ]; then
            echo "Creating missing app/build.gradle.kts..."
            cat << 'EOF' > app/build.gradle.kts
        plugins {
            id("com.android.application")
        }
        android {
            namespace = "com.ultracompiler.app"
            compileSdk = 34
            defaultConfig {
                applicationId = "com.ultracompiler.app"
                minSdk = 24
                targetSdk = 34
                versionCode = 1
                versionName = "1.0"
            }
        }
        EOF
        fi
        
        # Auto-generate wrapper if missing
        if [ ! -f "./gradlew" ]; then
            echo "Gradle wrapper not found. Initializing gradle wrapper..."
            gradle wrapper
        fi
        
        chmod +x ./gradlew
        ./gradlew assembleDebug
