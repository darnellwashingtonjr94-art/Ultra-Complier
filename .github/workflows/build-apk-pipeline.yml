name: Build All-to-APK Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    name: Build All-to-APK Pipeline

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Python Environment
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Setup Java (For Android SDK/D8)
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK & NDK
        run: |
          echo "y" | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --install "build-tools;34.0.0" "platform-tools" "platforms;android-34"
          echo "ANDROID_HOME=${ANDROID_HOME}" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=${ANDROID_HOME}" >> $GITHUB_ENV

      - name: Install LLVM & Clang
        run: |
          sudo apt-get update
          sudo apt-get install -y llvm clang llvm-dev

      - name: Install Rust (For Rust Frontend)
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true

      - name: Install Go (For Go Mobile Runtime)
        uses: actions/setup-go@v4
        with:
          go-version: '1.20'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run Integration Tests (Generate APKs)
        run: |
          pytest tests/ -v

      - name: Upload Compiled APK Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: generated-apks
          path: build_tmp/*.apk
          retention-days: 7
