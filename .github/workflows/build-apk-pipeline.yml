name: Build All-to-APK Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    name: Build All-to-APK Pipeline

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python Environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Set up Java (For Android SDK/DB)
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set Up Android SDK & NDK
      run: |
        # Download and set up Android Command Line Tools properly
        ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-$ANDROID_HOME}
        mkdir -p $ANDROID_SDK_ROOT/cmdline-tools
        cd $ANDROID_SDK_ROOT/cmdline-tools
        curl -o commandlinetools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
        unzip -q commandlinetools.zip
        mkdir -p latest
        mv cmdline-tools/* latest/ 2>/dev/null || true
        rm commandlinetools.zip

        # Accept licenses and install build tools, platform tools, and platforms
        yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses --sdk_root=$ANDROID_SDK_ROOT
        $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --sdk_root=$ANDROID_SDK_ROOT \
          "platforms;android-34" \
          "build-tools;34.0.0" \
          "platform-tools"

        echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
        echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
        echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/26.1.10909125" >> $GITHUB_ENV

    - name: Install LLVM & CLANG
      run: |
        sudo apt-get update
        sudo apt-get install -y llvm clang

    - name: Install Rust (For Rust Frontend)
      uses: dtolnay/rust-toolchain@stable

    - name: Install Go (For Go Mobile Runtime)
      uses: actions/setup-go@v5
      with:
        go-version: '1.20'

    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Run Integration Tests (Generate APK)
      run: |
        pytest tests/ -v

    - name: Upload Compiled APK Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: generated-apks
        path: app-release.apk
        retention-days: 7
