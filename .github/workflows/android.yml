name: Ultra-Compiler CI/CD Pipeline

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    name: Build All-to-APK Pipeline
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Python Environment
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Setup Java (For Android SDK/D8)
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK & NDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'build-tools;34.0.0 platforms;android-34 ndk;25.2.9519653'

      - name: Install LLVM & Clang
        run: |
          sudo apt-get update
          sudo apt-get install -y llvm clang

      - name: Install Rust (For Rust Frontend)
        uses: dtolnay/rust-toolchain@stable

      - name: Install Go (For Go Mobile Runtime)
        uses: actions/setup-go@v4
        with:
          go-version: '1.21'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest llvmlite

      - name: Run Integration Tests (Generate APKs)
        run: |
          export ANDROID_SDK=$ANDROID_HOME
          export ANDROID_NDK=$ANDROID_HOME/ndk/25.2.9519653
          pytest tests/ -v

      - name: Upload Compiled APK Artifacts
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: ultra-compiled-apks
          path: build_tmp/*.apk
          retention-days: 7
